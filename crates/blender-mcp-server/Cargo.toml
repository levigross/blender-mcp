[package]
name = "blender-mcp-server"
description = "Scheme-first MCP server for live and headless Blender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "blender_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "blender-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
blender-mcp-protocol.workspace = true
blender-mcp-transport.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
steel-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
blender-mcp-protocol.workspace = true
futures.workspace = true
# The real MCP client keeps the protocol tests honest about transport-level
# requirements (SEP-2243 routing headers, stateless negotiation metadata, SSE framing).
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
tokio-util.workspace = true
tower.workspace = true

