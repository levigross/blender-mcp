name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    name: Rust and CPU Blender checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Run checks with CPU Blender
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.cargo-fmt \
            .#checks.x86_64-linux.cargo-clippy \
            .#checks.x86_64-linux.cargo-doc \
            .#checks.x86_64-linux.cargo-deny \
            .#checks.x86_64-linux.cargo-audit \
            .#checks.x86_64-linux.cargo-test \
            .#checks.x86_64-linux.cargo-test-native \
            .#checks.x86_64-linux.python-lint \
            .#checks.x86_64-linux.shell-lint \
            .#checks.x86_64-linux.source-layout \
            .#checks.x86_64-linux.bridge \
            .#checks.x86_64-linux.extension \
            .#checks.x86_64-linux.blender-api \
            .#checks.x86_64-linux.mcp-headless \
            .#checks.x86_64-linux.mcp-benchmark
