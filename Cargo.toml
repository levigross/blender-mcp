[workspace]
resolver = "3"
members = [
  "crates/blender-mcp-protocol",
  "crates/blender-mcp-transport",
  "crates/blender-mcp-server",
  "crates/blender-mcp-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/levigross/blender-mcp"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
blender-mcp-protocol = { path = "crates/blender-mcp-protocol", version = "0.1.0" }
blender-mcp-transport = { path = "crates/blender-mcp-transport", version = "0.1.0" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
steel-core = "0.8"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
# The Steel worker isolates VM panics with `catch_unwind` and rebuilds its engine,
# so unwinding must stay enabled; `panic = "abort"` would take the server down instead.
strip = "symbols"

# steel-core 0.8.3 plus fixes pending upstream:
# - mattwparas/steel#707: constant evaluation and function inlining copied top-level
#   defines into code compiled alongside them, so a later `set!` was invisible to it.
# - mattwparas/steel#713: a program that failed to build lost every existing global
#   it redefined.
# Drop the patch (and the deny.toml allow-git entry) once a release includes both.
[patch.crates-io]
steel-core = { git = "https://github.com/levigross/steel", rev = "eacc1bbbcf413b6a4d366cca90147acb56b403cc" }
